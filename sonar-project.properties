#sonar.projectKey=my:project
#sonar.projectName=SRU-Service
#sonar.projectVersion=1.0
sonar.sources=
#sonar.tests=**/src/test/java
#sonar.java.binaries=**/target/classes
#sonar.java.libraries=**/target/**/lib
#sonar.java.test.libraries=**/target/**/WEB-INF/lib
#sonar.java.libraries.empty=true
#sonar.dynamicAnalysis=reuseReports
#sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco-aggregate/jacoco.xml
#sonar.sourceEncoding=UTF-8
#sonar.projectDescription=
#sonar.links.homepage=
#sonar.links.ci=
#sonar.links.issue=
#sonar.links.scm=
#sonar.exclusions=
#sonar.test.exclusions=
#sonar.java.libraries=
#sonar.jdbc.dialect=mssql
#sonar.language=java
#sonar.verbose=true
# Multi-Module Konfiguration
sonar.modules=domainmodel,domainmodel-tei-mapper,hsp-nachweis

# domainmodel Modul
domainmodel.sonar.projectName=domainmodel
domainmodel.sonar.sources=src/main/java
domainmodel.sonar.tests=src/test/java
domainmodel.sonar.java.test.libraries=target/domainmodel/WEB-INF/lib
domainmodel.sonar.java.binaries=target/classes
domainmodel.sonar.java.libraries=target/domainmodel/WEB-INF/lib
domainmodel.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# domainmodel-tei-mapper Modul
domainmodel-tei-mapper.sonar.projectName=domainmodel-tei-mapper
domainmodel-tei-mapper.sonar.sources=src/main/java
domainmodel-tei-mapper.sonar.tests=src/test/java
domainmodel-tei-mapper.sonar.java.test.libraries=target/domainmodel-tei-mapper/WEB-INF/lib
domainmodel-tei-mapper.sonar.java.binaries=target/classes
domainmodel-tei-mapper.sonar.java.libraries=target/domainmodel-tei-mapper/WEB-INF/lib
domainmodel-tei-mapper.sonar.junit.reportPaths=target/test-reports
domainmodel-tei-mapper.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# hsp-nachweis Modul (Hauptanwendung mit Quarkus)
hsp-nachweis.sonar.projectName=hsp-nachweis
hsp-nachweis.sonar.sources=src/main/java
hsp-nachweis.sonar.tests=src/test/java
hsp-nachweis.sonar.java.test.libraries=target/quarkus-app/lib
hsp-nachweis.sonar.java.binaries=target/classes
hsp-nachweis.sonar.java.libraries=target/quarkus-app/lib
hsp-nachweis.sonar.junit.reportPaths=target/test-reports
hsp-nachweis.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml

# Dependency Check Reports
sonar.dependencyCheck.htmlReportPath=dependency-check-report.html
sonar.dependencyCheck.jsonReportPath=dependency-check-report.json

# Code Coverage Exclusions
sonar.coverage.exclusions=**/src/test/**/*,**/src/integration-test/**/*,**/generated/**/*,**/target/**/*

# Test Exclusions
sonar.test.exclusions=**/target/**/*
sonar.projectKey=staatsbibliothek-berlin.hsp:nachweis-service:public
sonar.projectVersion=4.0.82-hotfix
sonar.exclusions=**/test/**/*, **/.git/**/*, **/node_modules/**/*, **/*.html, **/target/**, **/*.png, **/*.jpg, **/*.jpeg, **/*.gif, **/*.pdf, **/*.eapx, **/*.xlsx, **/*.xls, **/*.docx, **/*.doc, **/*.zip, **/*.jar, **/*.class
