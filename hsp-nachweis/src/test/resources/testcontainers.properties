# Pull all Docker Hub images (Solr, Postgres, Kafka dev services, ...) from the internal
# registry instead of docker.io. Committed here so it also applies in CI, where the
# developer's ~/.testcontainers.properties is absent.
hub.image.name.prefix=artefakt.dev.sbb.berlin:5000/
ryuk.container.image=testcontainers/ryuk:0.14.0
testcontainers.ryuk.disabled=false
testcontainers.reuse.enable=false
