dateiupload_invalidfiletypemessage=Dieser Dateityp wird vom System nicht unterst\u00FCtzt. Bitte verwenden Sie XML-, TTL- oder ZIP-Archiv-Dateien.
dateiupload_invalidfilesizemessage=Die Datei \u00FCberschreitet die Maximalgr\u00F6\u00DFe von 100 MB.
dateiupload_kodguidetext=Hier k\u00F6nnen Sie Kulturobjektdokumente importieren, die bereits im Handschriftenportal vorhanden sind und nach einer Massenmanipulation in den Datenbestand zur\u00FCckgef\u00FChrt werden sollen. Voraussetzung f\u00FCr einen erfolgreichen Import ist das Vorhandensein einer g\u00FCltigen ID des HSP in den Dokumenten.Um neue Kulturobjekte zu registrieren, die noch nicht im Handschriftenportal vorhanden sind, nutzen sie bitte die Seite "Kulturobjekte registrieren" [Link zu "Kulturobjekte registrieren"]
dateiupload_beschreibungguidetext_tei=Hier k\u00F6nnen Sie Beschreibungen importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte die XML-Vorlage, die Sie auf dieser Seite downloaden k\u00F6nnen.
dateiupload_beschreibungguidetext_mxml=Hier k\u00F6nnen Sie Beschreibungen im MXML Format importieren. Als Importformat stellen Sie bitte sicher, dass die Daten beim Export aus MXML unter "Extras - Optionen - Export" mit der Option "RTF-Felder beim Datenexport in XML-Felder umsetzen" exportiert wurden.
dateiupload_katalogguidetext=Hier k\u00F6nnen Sie einen Katalog importieren. Achtung: Sollten Sie einen bereits vorhandenen Katalog importieren, so wird dieser bereits vorhandene Katalog mit den aktualisierten Daten \u00FCberschrieben.
dateiupload_ortguidetext=Hier k\u00F6nnen Sie Orte importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte die XML-Vorlage, die Sie auf dieser Seite downloaden k\u00F6nnen. Die Angabe des Ortsnamens ist verpflichtend. Bitte recherchieren Sie au\u00DFerdem m\u00F6gliche GND- und GeoNames-IDs Ihrer Orte. Je mehr Referenzen Ihr Ort hat, desto eindeutiger und aussagekr\u00E4ftiger wird er.
dateiupload_digitalisatguidetext=Hier k\u00F6nnen Sie Referenzen auf Kulturobjektdigitalisate importieren, die noch nicht im Handschriftenportal vorhanden sind (Die Kulturobjekte, zu denen Sie Digitalisate importieren m\u00F6chten, m\u00FCssen jedoch bereits im Portal vorhanden sein). Achtung: Sollten Sie bereits vorhandene Referenzen zu einem Kulturobjekt (URL und Typ identisch) importieren, so wird diese bereits vorhandene Referenz mit den aktualisierten Daten \u00FCberschrieben! Als Importformat nutzen Sie bitte die XML-Vorlage, die Sie auf dieser Seite downloaden k\u00F6nnen. Die Angabe der G\u00FCltigen Signatur des Kulturobjekts sowie der Digitalisatadresse sind verpflichtend. Achtung: Die G\u00FCltige Signatur muss diejenige sein, die das Kulturobjekt im Portal hat. Bei der Adresse des Digitalisats kann es sich um die Adresse eines IIIF-Manifests oder eines anderen Pr\u00E4sentationsform handeln. Detailliertere Erfassungshilfen finden Sie hier [PDF-Download einer Hilfedatei].
dateiupload_koerperschaftguidetext=Hier k\u00F6nnen Sie K\u00F6rperschaften (Bibliotheken, Archive Museen o.\u00E4.) importieren, die noch nicht im Handschriftenportal vorhanden sind.Nutzen Sie als Importformat bitte die XML-Vorlage, die auf dieser Seite zum Download zur Verf\u00FCgung steht. Die Angaben des Orts- und K\u00F6rperschaftsnamens sind verpflichtend. Achten Sie bitte darauf, dass die Orte, an denen sich Ihre K\u00F6rperschaften befinden bzw. befanden, bereits im Ortsregister <a href="/orte.xhtml">Orte</a> des Handschriftenportals vorhanden sind.
dateiupload_beziehungenguidetext=Hier k\u00F6nnen Sie Beziehungen importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte die XML-Vorlage, die Sie auf dieser Seite downloaden k\u00F6nnen. Beziehungen sind als Einheit von "Subjekt-Pr\u00E4dikat-Objekt" modelliert. Als notwendige Angaben ben\u00F6tigen Sie den Namen der Beziehung, wie sie im Schema "www.schema.org" bezeichnet ist (Pr\u00E4dikat) sowie die HSP-IDs der durch die Beziehung verbundenen Normdaten (Subjekt, Objekt).
dateiupload_personguidetext=Hier k\u00F6nnen Sie Personen (Autoren, Schreiber, Vorbesitzer o.\u00E4.) importieren, die noch nicht im Handschriftenportal vorhanden sind. Nutzen Sie als Importformat bitte die XML-Vorlage, die auf dieser Seite zum Download zur Verf\u00FCgung steht.
dateiupload_spracheguidetext=Hier k\u00F6nnen Sie Sprachen importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte die XML-Vorlage, die Sie auf dieser Seite downloaden k\u00F6nnen.
dateiupload_konzeptguidetext=Hier k\u00F6nnen Sie Konzepte importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte Turtle-Dateien. Stimmen Sie sich bitte mit der Datenredaktion ab.
dateiupload_initien_guidetext=Hier k\u00F6nnen Sie Initien importieren, die noch nicht im Handschriftenportal vorhanden sind. Als Importformat nutzen Sie bitte Turtle-Dateien. Stimmen Sie sich bitte mit der Datenredaktion ab.
