datenuebernahme_intern_extern=\u000AAt Selection "interal/external" Data:\u000AExterne Daten werden in der Pr\u00E4sentation des HSP angezeigt, ihre Pflege geschieht jedoch nicht im Nachweis des HSP. Jeder neue Import \u00FCberschreibt die bereits vorhandenen Daten.\u000AInterne Daten werden in der Pr\u00E4sentation des HSP angezeigt und im Nachweis des HSP gepflegt. Achtung: Nach einem initialen Import k\u00F6nnen Sie diese Daten nicht wieder ohne weiteres importieren!\u000AWollen Sie bereits vorhandenen Daten dennoch ersetzen, so m\u00FCssen diese vorher im Nachweis gel\u00F6scht werden. Nehmen Sie hierf\u00FCr bitte Kontakt mit der Redaktion auf.
