<?xml version="1.0" encoding="UTF-8"?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="templates/default.xhtml">
    <ui:define name="content">
        <div id="error">

            <h1><h:outputText id="error_general" value="#{msg.errorgeneral}"/></h1>

            <h:outputText value="#{msg.errorauthentication}"/>

            <p:growl id="authentication_messages" showDetail="true" autoUpdate="true"
                     closable="true" life="4000"
                     showSummary="true" globalOnly="true"/>

            <h:messages globalOnly="true"/>

            <h:outputText id="error_message" value="#{param['errormsg']}"/>

        </div>
    </ui:define>
</ui:composition>
