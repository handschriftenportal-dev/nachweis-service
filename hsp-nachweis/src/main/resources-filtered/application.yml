quarkus:
  package:
    jar:
      type: fast-jar
  native:
    container-build: false
  arc:
    remove-unused-beans: none
  http:
    test-timeout: 60s
    cors:
      enabled: true
      origins: /.*/
    port: 9298
    root-path: /
    limits:
      max-body-size: 100M
    enable-compression: true
  transaction-manager:
    object-store:
      directory: target/tx-object-store
  servlet:
    context-path: /
  index-dependency:
    domainmodel:
      group-id: staatsbibliothek-berlin.hsp
      artifact-id: domainmodel
    oauth2:
      group-id: staatsbibliothek-berlin
      artifact-id: oauth2
    auth-api:
      group-id: staatsbibliothek-berlin
      artifact-id: auth-api
    activitystreams-hsp:
      group-id: de.staatsbibliothek-berlin.hsp
      artifact-id: activitystreams-hsp
  swagger-ui:
    always-include: true
    path: /docs
  datasource:
    db-kind: postgresql

  log:
    console:
      level: INFO
      format: "%d{dd.MM.yyyy HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n"
    category:
      "io.quarkus.arc.processor":
        level: INFO
  flyway:
    migrate-at-start: true
  cache:
    caffeine:
      GraphQlDataByQuery:
        expire-after-write: 300S
        maximum-size: 10
  jackson:
    write-dates-as-timestamps: true
  kafka:
    devservices:
      enabled: false
  oauth2:
    client-id: hsp
    client-secret: HSPsecretHSP
    introspection-url: http://localhost:8084/oauth/check_token
  smallrye-openapi:
    security-scheme: oauth2
    security-scheme-description: Please enter OAUTH2 JWT Token to authorize
  oidc-client:
    normdaten-service:
      discovery-enabled: false
      token-path: http://localhost:8084/oauth/token
      grant:
        type: password
      grant-options:
        password:
          username: hspnormserviceuser
          password: changeme
      client-id: hsp
      credentials:
        secret: HSPsecretHSP
  hibernate-orm:
    persistence-xml:
      ignore: true
    database:
      version-check:
        enabled: false
    unsupported-properties:
      "hibernate.event.merge.entity_copy_observer": allow
      current_session_context_class: thread
    jdbc:
      statement-batch-size: 50
  smallrye-graphql-client:
    normdaten-erkennung-graphql: &graphql-client-defaults
      url: ${hsp.services.normdaten.graphql}
    normdaten-mutation-graphql:
      <<: *graphql-client-defaults
    person-graphql:
      <<: *graphql-client-defaults
    initium-graphql:
      <<: *graphql-client-defaults
  stork:
    normdaten-service:
      service-registrar:
        enabled: false
      service-discovery: &eureka-defaults
        type: eureka
        eureka-host: ${hsp.eureka.host}
        eureka-port: 8761
        eureka-context-path: /serviceregistry/
        application: NORMDATENSERVICE
        secure: false
        refresh-period: 5S
    importservice:
      service-registrar:
        enabled: false
      service-discovery:
        <<: *eureka-defaults
        application: IMPORTSERVICE
    hsp-fo-discovery:
      service-registrar:
        enabled: false
      service-discovery:
        <<: *eureka-defaults
        application: HSP-FO-DISCOVERY
  rest-client:
    normdaten-graphql-rest:
      url: ${hsp.services.normdaten.graphql}
    normdaten-gnd-service:
      url: ${hsp.services.normdaten.rest}
    normdaten-orte:
      url: ${hsp.services.normdaten.rest}
    import-service:
      url: ${hsp.services.importservice.rest}
    tei-validation-service:
      url: ${hsp.services.importservice.rest}
      read-timeout: 90000
    schema-pflege-datei-service:
      url: ${hsp.services.importservice.rest}
    discovery-service:
      url: ${hsp.services.hsp-fo-discovery.base}
    purl-gen:
      url: http://purlgen.sbb.spk-berlin.de/sbbpurl/purlgen.pl
    dnb-culturegraph:
      url: http://hub.culturegraph.org/entityfacts/
    lobid-org:
      url: https://lobid.org/gnd/

oauth2:
  vipaddress: IDENTITYMANAGEMENT
  realm: " "
  protocoltype: OAUTH
  filter:
    enabled: true
  logincheck:
    enabled: true
  permissioncheck:
    enabled: true
  client:
    id: hsp
    secret: HSPsecretHSP
  redirect-uri:
    grant-code: /dashboard.xhtml
    revoke-token: /dashboard.xhtml
    error: /error_authentication.xhtml
  own:
    url:
      prefix: currentServerAddress

hsp:
  version: @handschriftenportal.version@
  eureka:
    host: localhost
  services:
    normdaten:
      base: stork://normdaten-service
      rest: ${hsp.services.normdaten.base}/rest
      graphql: ${hsp.services.normdaten.rest}/graphql
    importservice:
      base: stork://importservice
      rest: ${hsp.services.importservice.base}/rest
    hsp-fo-discovery:
      base: stork://hsp-fo-discovery

nachweis:
  version: @project.version@
  import:
    intern:
      published:
        enabled: true

workaround:
  ADD_BESCHREIBUNG_MSDESC_IN_KOD_SOURCE_DESC: true

org:
  apache:
    el:
      parser:
        SKIP_IDENTIFIER_CHECK: false
    myfaces:
      USE_LAMBDA_METAFACTORY: false

jakarta:
  faces:
    ENABLE_WEBSOCKET_ENDPOINT: true
    FACELETS_BUFFER_SIZE: 32768
    STATE_SAVING_METHOD: client


# kafka startOffset values:
# -999  : set the offset to the end
# -1    : leave the offset unchanged
#  0    : set the offset at the beginning
# >0    : set the offset to the provided value

kafka:
  bootstrapserver: localhost:9092,localhost:9093,localhost:9094
  active: true
  transaction:
    timeout: 900
  import:
    topic: tei-import
    startOffset: -1
    groupid: nachweis
  index:
    topic: tei-index
    startOffset: -1
    groupid: nachweis-index
  dataimport:
    topic: data-import
    startOffset: -1
    groupid: data-nachweis
  normdaten:
    topic: data-normdaten
    startOffset: -1
    groupid: nachweis-normdaten
  normdatenupdate:
    topic: normdatenupdate
    startOffset: -1
    groupid: data-nachweis
importserverbaseurl: http://localhost:9296
praesentationbaseurl: http://localhost:8080/
nachweisserverbaseurl: http://localhost:8080/

solr:
  url:
    leader: ${SOLR_LEADER_URL}
    follower: ${SOLR_LEADER_URL}
  core:
    nachweis: ${SOLR_CORE_NACHWEIS}
    praesentation: ${SOLR_CORE_PRAESENTATION}
  connectionTimeout: 10000
  requestTimeout: 90000

proxy:
  http:
    host: 
    port: 

wiremock:
  server:
    port: 0

suchdokumentservice:
  reindexall:
    documents_per_update: 500
indexservice:
  reindexall:
    documents_per_update: 1000

datensicherung:
  path: ./data-backups

oaipmh:
  baseUrl: https://erfassung.handschriftenportal.de/rest/oai-pmh
  repositoryName: Handschriftenportal
  adminEmail[0]: handschriftenportal@sbb.spk-berlin.de
  granularity: day
  deletedRecord: persistent
  enabled: true
  metadataFormats:
    tei:
      prefix: oai_tei
      namespace: http://www.tei-c.org/ns/1.0
    dc:
      prefix: oai_dc
      namespace: http://purl.org/dc/elements/1.1/
      schemaResourceId: tei2dc.xsl
    marc21:
      prefix: oai_marc21
      namespace: http://www.loc.gov/MARC21/slim
      schemaResourceId: tei2marc.xsl
      additionalResourceIds:
        - marc21_codes_mapping.xml

sperre:
  cleanup:
    expirationMinutes: 30
    interval: 15m

normdatenerkennung:
  scheduler:
    process-interval: PT10s
    apply-interval: PT10s
    stale-recovery-interval: PT5m
  cleanup:
    processing-minutes: 10

purl:
  target:
    kod: http://b-dev1047.pk.de:8080/search?hspobjectid={0}
    beschreibung: http://b-dev1047:8080/workspace?type=hsp:description&id={0}
    beschreibung_retro: http://b-dev1047:8080/workspace?type=hsp:description_retro&id={0}
  autogenerate:
    enabled: true
  resolver:
    url: https://resolver.staatsbibliothek-berlin.de/
    directory: /tmp/
    command: httxt2dbm -f DB -i {0} -o {1}
    dbm-file-name: hsp_purl.dbm
    txt-file-name: hsp_purl.txt
    enabled: false
    scheduler-every: "off"

feature:
  presentationIndexing:
    enabled: true
